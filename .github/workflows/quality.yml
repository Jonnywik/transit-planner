name: Verify pull requests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Tests, coverage, and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      # v4.2.2 — immutable SHA verified on 2026-08-27
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v4.4.0 — immutable SHA verified on 2026-08-27
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          check-latest: true
      - name: Display runtime versions
        run: node --version && npm --version
      - name: Run native test coverage
        run: npm run coverage
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run mobile visual smoke check
        run: npm run smoke:mobile
