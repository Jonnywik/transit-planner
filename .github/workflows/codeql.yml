name: CodeQL security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '28 3 * * 3'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v4.2.2 — immutable SHA verified on 2026-08-27
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v3.28.17 — immutable SHA verified on 2026-08-27
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d
        with:
          languages: javascript-typescript
          build-mode: none
      # v3.28.17 — immutable SHA verified on 2026-08-27
      - name: Analyze
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d
        with:
          category: /language:javascript-typescript
